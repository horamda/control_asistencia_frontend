<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FichaYa · Prueba de cámara</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#17324d;font:17px/1.5 system-ui,sans-serif;padding:24px 16px}main{max-width:540px;margin:auto;background:white;padding:24px;border-radius:20px}h1{font-size:25px;margin:0 0 12px}button,a{font:inherit}button{width:100%;min-height:48px;border:0;border-radius:12px;padding:12px;background:#23618c;color:white;margin:8px 0}button:disabled{opacity:.55}video{width:100%;max-height:300px;background:#111;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf2f7;padding:12px;border-radius:12px;font:14px/1.5 ui-monospace,monospace}a{color:#23618c}p{margin:12px 0}
  </style>
</head>
<body><main>
  <h1>Prueba de cámara trasera</h1>
  <p>Esta prueba consulta a Safari directamente, sin el escáner de FichaYa. No toma fotos ni envía imágenes.</p>
  <button id="start">Probar cámara trasera</button>
  <button id="stop" hidden>Cerrar cámara</button>
  <video id="preview" autoplay muted playsinline hidden></video>
  <pre id="result" aria-live="polite">Prueba lista · diagnóstico 1</pre>
  <button id="copy">Copiar resultado</button>
  <p id="copy-status" aria-live="polite"></p>
  <a href="/">Volver a FichaYa</a>
</main><script src="camera-check.js"></script></body>
</html>
